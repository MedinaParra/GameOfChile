plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atatis.bosque'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atatis.bosque'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}
