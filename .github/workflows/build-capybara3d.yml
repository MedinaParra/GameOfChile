name: Build Capibara 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/capibara-3d-apk
    paths:
      - "Capybara3D-source.tar.gz.b64"
      - ".github/workflows/build-capybara3d.yml"
  pull_request:
    branches:
      - master
    paths:
      - "Capybara3D-source.tar.gz.b64"
      - ".github/workflows/build-capybara3d.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tree
        run: |
          base64 --decode Capybara3D-source.tar.gz.b64 > Capybara3D-source.tar.gz
          tar -xzf Capybara3D-source.tar.gz
          test -f Capybara3D/settings.gradle

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: Capybara3D
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare artifact
        run: |
          cp Capybara3D/app/build/outputs/apk/debug/app-debug.apk Capibara3D-v1.0.0-debug.apk
          sha256sum Capibara3D-v1.0.0-debug.apk > Capibara3D-v1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capibara3D-v1.0.0-debug
          path: |
            Capibara3D-v1.0.0-debug.apk
            Capibara3D-v1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
