name: PR Build Tatis Android APK

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Reconstruct and patch Samsung A26 build
        run: python3 ci/build_tatis.py && python3 ci/fix_touch.py && python3 ci/fix_android_project.py && python3 ci/fix_arm_export.py

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.6.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable" /tmp/godot_templates
          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Configure Android and signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.6.tres"
          rm -f "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/tatis-release.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Tatis,C=CL"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/tatis-release.keystore" -storepass TatisBuild2026 -alias tatis -keypass TatisBuild2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tatis Laberinto,O=Tatis,C=CL"
          python3 ci/build_tatis.py --signing
          python3 ci/fix_touch.py
          python3 ci/fix_android_project.py
          python3 ci/fix_arm_export.py

      - name: Import and parse all GDScript
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --editor --quit --verbose 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" godot-import.log

      - name: Menu runtime smoke test
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --quit-after 180 2>&1 | tee godot-runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid assignment|ERROR: Failed to load" godot-runtime.log

      - name: Full world gameplay smoke test
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --script res://tests/RuntimeWorldSmoke.gd 2>&1 | tee godot-world-smoke.log
          grep -q "WORLD SMOKE: OK" godot-world-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid assignment|WORLD SMOKE FAILED" godot-world-smoke.log

      - name: Export Samsung A26 debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.debug.keystore"
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --export-debug "Android" "$GITHUB_WORKSPACE/Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26.apk" 2>&1 | tee godot-export-debug.log
          test -s Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26.apk
          unzip -t Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26.apk

      - name: Export Samsung A26 release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tatis-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tatis
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: TatisBuild2026
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --export-release "Android" "$GITHUB_WORKSPACE/Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26_release.apk" 2>&1 | tee godot-export-release.log
          test -s Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26_release.apk
          unzip -t Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26_release.apk

      - name: Validate and package deliverables
        run: |
          python3 project/tests/static_validate.py | tee static-validation.log
          python3 ci/finalize_docs.py
          sha256sum *.apk | tee APK_SHA256SUMS.txt
          cp project/README.md project/CHANGELOG.md project/LICENSES.md project/REPORTE_PRUEBAS.md project/ERRORES_CORREGIDOS.md .
          rm -rf project/.godot
          cd project
          zip -qr ../Tatis_Laberinto_Fauno_v1.0.1_Proyecto_Godot.zip .
          cd ..
          ls -lh *.apk Tatis_Laberinto_Fauno_v1.0.1_Proyecto_Godot.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tatis-Laberinto-Fauno-v1.0.1-Samsung-A26
          retention-days: 30
          if-no-files-found: warn
          path: |
            Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26.apk
            Tatis_Laberinto_Fauno_v1.0.1_Samsung_A26_release.apk
            Tatis_Laberinto_Fauno_v1.0.1_Proyecto_Godot.zip
            README.md
            CHANGELOG.md
            LICENSES.md
            REPORTE_PRUEBAS.md
            ERRORES_CORREGIDOS.md
            APK_SHA256SUMS.txt
            godot-import.log
            godot-runtime.log
            godot-world-smoke.log
            godot-export-debug.log
            godot-export-release.log
            static-validation.log
