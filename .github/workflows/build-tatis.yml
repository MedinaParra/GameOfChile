name: Build Tatis Android APK

on:
  push:
    branches: ["agent/tatis-laberinto-fauno-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct editable project
        run: |
          cat bootstrap_parts/part_* > bootstrap.py
          python3 bootstrap.py
          rm -rf project
          mv tatis project

      - name: Apply Godot compatibility corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(rel, replacements, append=''):
              p = Path('project') / rel
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      print(f'NOTICE missing patch token in {rel}: {old[:60]!r}')
                  s = s.replace(old, new)
              if append:
                  s += append
              p.write_text(s, encoding='utf-8')

          pg = Path('project/project.godot')
          s = pg.read_text(encoding='utf-8')
          if '\n[input]\n' in s:
              s = s.split('\n[input]\n', 1)[0].rstrip() + '\n'
          pg.write_text(s, encoding='utf-8')

          patch('scripts/GameManager.gd', [
              ('func _ready() -> void:\n    add_to_group("game")',
               'func _ready() -> void:\n    _setup_input_actions()\n    add_to_group("game")'),
              ('    final_ready=true; if door:door.open(); if exit_light:exit_light.light_energy=4.0',
               '    final_ready = true\n    if door:\n        door.open()\n    if exit_light:\n        exit_light.light_energy = 4.0'),
              ('("❤ " .repeat(v)+"♡ " .repeat(3-v)).strip_edges()',
               '("❤ ".repeat(v) + "♡ ".repeat(3-v)).strip_edges()'),
              ('return "%02d:%02d"%[int(t)/60,int(t)%60]',
               'return "%02d:%02d" % [int(t) / 60, int(t) % 60]'),
          ], append='''

func _setup_input_actions() -> void:
    var bindings := {
        "move_left": KEY_A,
        "move_right": KEY_D,
        "move_forward": KEY_W,
        "move_back": KEY_S,
        "jump": KEY_SPACE,
        "run": KEY_SHIFT,
        "interact": KEY_E,
        "cluck": KEY_Q,
        "pause_game": KEY_ESCAPE,
    }
    for action in bindings:
        if not InputMap.has_action(action):
            InputMap.add_action(action, 0.2)
        if InputMap.action_get_events(action).is_empty():
            var key := InputEventKey.new()
            key.physical_keycode = bindings[action]
            InputMap.action_add_event(action, key)
''')

          patch('scripts/Checkpoint.gd', [
              ('    body_entered.connect(func(b): if b is PlayerController and not active: active=true; activated.emit(checkpoint_id,global_position+Vector3.UP))',
               '    body_entered.connect(_on_body_entered)'),
          ], append='''

func _on_body_entered(body: Node) -> void:
    if body is PlayerController and not active:
        active = true
        activated.emit(checkpoint_id, global_position + Vector3.UP)
''')

          patch('scripts/MagicRoots.gd', [
              ('    body_entered.connect(func(b): if active and b is PlayerController: b.take_damage())',
               '    body_entered.connect(_on_body_entered)'),
          ], append='''

func _on_body_entered(body: Node) -> void:
    if active and body is PlayerController:
        body.take_damage()
''')

          patch('scripts/CrowEnemy.gd', [
              ('    for c in get_children(): if c.name=="Wing": c.rotation.z=sin(phase*8.0)*.55',
               '    for c in get_children():\n        if c.name == "Wing":\n            c.rotation.z = sin(phase * 8.0) * 0.55'),
          ])

          patch('scripts/PuzzleManager.gd', [
              ('    timed_open=true; if timed_door: timed_door.open(); message.emit("¡Cruza antes de que termine el brillo!")',
               '    timed_open = true\n    if timed_door:\n        timed_door.open()\n    message.emit("¡Cruza antes de que termine el brillo!")'),
          ])

          patch('scripts/TouchControls.gd', [
              ('    joystick.changed.connect(func(v): if is_instance_valid(player): player.mobile_move = v)',
               '    joystick.changed.connect(_on_joystick_changed)'),
              ('    cam.dragged.connect(func(d): if is_instance_valid(player): player.add_look_delta(d)',
               '    cam.dragged.connect(_on_camera_dragged)'),
          ], append='''

func _on_joystick_changed(value: Vector2) -> void:
    if is_instance_valid(player):
        player.mobile_move = value

func _on_camera_dragged(delta: Vector2) -> void:
    if is_instance_valid(player):
        player.add_look_delta(delta)
''')

          patch('scripts/PlayerController.gd', [
              ('    var tw=create_tween(); tw.tween_property(visual,"modulate",Color(1,0.35,0.35,1),0.08); tw.tween_property(visual,"modulate",Color.WHITE,0.12); tw.set_loops(5)',
               '    var tw = create_tween()\n    tw.tween_property(visual, "scale", Vector3(0.9, 1.1, 0.9), 0.08)\n    tw.tween_property(visual, "scale", Vector3.ONE, 0.12)\n    tw.set_loops(5)'),
          ])
          PY

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Install Godot 4.6.3 and export templates
        run: |
          wget -q --show-progress https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          wget -q --show-progress https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.3.stable" /tmp/godot_templates
          unzip -q Godot_v4.6.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.3.stable/"

      - name: Configure Android and signing
        run: |
          JAVA_HOME_REAL="$JAVA_HOME"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_REAL"
          EOF
          rm -f "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/tatis-release.keystore"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Tatis,C=CL"
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/tatis-release.keystore" -storepass TatisBuild2026 -alias tatis -keypass TatisBuild2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tatis Laberinto,O=Tatis,C=CL"

      - name: Import and parse project
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --editor --quit --verbose 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" godot-import.log

      - name: Runtime smoke test
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --quit-after 180 2>&1 | tee godot-runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid access|Invalid assignment|ERROR: Failed to load" godot-runtime.log

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/.debug.keystore"
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --export-debug "Android" "$GITHUB_WORKSPACE/Tatis_Laberinto_Fauno_v1.0.0.apk" 2>&1 | tee godot-export-debug.log
          test -s Tatis_Laberinto_Fauno_v1.0.0.apk
          unzip -t Tatis_Laberinto_Fauno_v1.0.0.apk

      - name: Export release APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tatis-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: tatis
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: TatisBuild2026
        run: |
          ./Godot_v4.6.3-stable_linux.x86_64 --headless --path project --export-release "Android" "$GITHUB_WORKSPACE/Tatis_Laberinto_Fauno_v1.0.0_release.apk" 2>&1 | tee godot-export-release.log
          test -s Tatis_Laberinto_Fauno_v1.0.0_release.apk
          unzip -t Tatis_Laberinto_Fauno_v1.0.0_release.apk

      - name: Validate and package
        run: |
          python3 project/tests/static_validate.py | tee static-validation.log
          ls -lh *.apk
          sha256sum *.apk | tee APK_SHA256SUMS.txt
          cp project/README.md project/CHANGELOG.md project/LICENSES.md project/REPORTE_PRUEBAS.md project/ERRORES_CORREGIDOS.md .
          rm -rf project/.godot
          cd project && zip -qr ../Tatis_Laberinto_Fauno_Proyecto_Godot.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Tatis-Laberinto-Fauno-v1.0.0
          retention-days: 30
          if-no-files-found: error
          path: |
            Tatis_Laberinto_Fauno_v1.0.0.apk
            Tatis_Laberinto_Fauno_v1.0.0_release.apk
            Tatis_Laberinto_Fauno_Proyecto_Godot.zip
            README.md
            CHANGELOG.md
            LICENSES.md
            REPORTE_PRUEBAS.md
            ERRORES_CORREGIDOS.md
            APK_SHA256SUMS.txt
            godot-import.log
            godot-runtime.log
            godot-export-debug.log
            godot-export-release.log
            static-validation.log
