name: Build Capibara Offline Alpha 0.4

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create fully offline Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="CapibaraOfflineAlpha04"
          ASSETS="$PROJECT/app/src/main/assets"
          JAVA_DIR="$PROJECT/app/src/main/java/cl/medinaparra/capibaraoffline"
          mkdir -p "$ASSETS" "$JAVA_DIR"

          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CapibaraOfflineAlpha04"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.8.2" apply false
          }
          EOF

          cat > "$PROJECT/app/build.gradle" <<'EOF'
          plugins { id "com.android.application" }

          android {
              namespace "cl.medinaparra.capibaraoffline"
              compileSdk 35

              defaultConfig {
                  applicationId "cl.medinaparra.capibaraoffline.alpha04"
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName "0.4"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="false"
                  android:fullBackupContent="false"
                  android:label="Capibara Offline 0.4"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package cl.medinaparra.capibaraoffline;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public final class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE |
                      View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  );

                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

          npm install --no-save --no-package-lock three@0.128.0 meshoptimizer@0.20.0
          cp node_modules/three/build/three.min.js "$ASSETS/three.min.js"
          cp node_modules/three/examples/js/loaders/GLTFLoader.js "$ASSETS/GLTFLoader.js"
          DECODER="$(find node_modules/meshoptimizer -maxdepth 2 -type f \( -name 'meshopt_decoder.js' -o -name 'meshopt_decoder.cjs' \) | head -n 1)"
          test -n "$DECODER"
          cp "$DECODER" "$ASSETS/meshopt_decoder.js"

          GLB_URL='https://tripo-data.rg1.data.tripo3d.com/tripo-studio/20260804/b83cf9ce-7a63-4a9c-8b78-23bf148a34f0/tripo_pbr_model_b83cf9ce-7a63-4a9c-8b78-23bf148a34f0_meshopt.glb?Key-Pair-Id=K1676C64NMVM2J&&Signature=khu1nqaZi6Deh-sdVhhMU3zubPUF3z1K4DLbpLgbYcZviS1ITHxBRXU0R2i4jYNV027vUJEDIgAIRPZR0lHBev8BJp76ZT-QVn7OsVikZADTSMt0Dweja5TLuKe33yZfWdSfcEAw0xVov7qVTDYIH~gzlFlrYpOKKIstYLSRJnLOjIwFK6TzgMUf~AXD-zt1qMzfCtbgd16FZbmbuekRpj2L~uBm9kn6lorpHM-1CxzR6-hoWudZsLJcqkEfnQgdEckqQQazK2Kcvs1aWzfXvrIh0rIy4vA-3QncVCswMv0ziHqfmcDWKJmtkVPodkitxr9w2wmJW5vD4kkFUdL7WA__'
          curl --fail --location --retry 3 --retry-delay 2 "$GLB_URL" --output "$ASSETS/capibara.glb"
          echo 'de01c18f6fdb37f353c3ed76924361e543aa30b8872f17a6cd957529f30191ce  '"$ASSETS/capibara.glb" | sha256sum --check --strict
          test "$(stat -c%s "$ASSETS/capibara.glb")" = "13168280"

          cat > "$ASSETS/index.html" <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <title>Capibara Offline 0.4</title>
            <style>
              :root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101815}canvas{display:block;width:100%;height:100%;touch-action:none}
              #top{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:20;display:flex;justify-content:space-between;pointer-events:none}
              .pill{padding:8px 12px;border-radius:999px;background:rgba(20,30,26,.82);border:1px solid rgba(255,255,255,.15);font-size:13px;font-weight:750;box-shadow:0 5px 18px rgba(0,0,0,.3)}
              #face{position:fixed;left:50%;top:41%;width:142px;height:92px;transform:translate(-50%,-50%);z-index:12;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
              .eye{position:absolute;top:18px;width:21px;height:27px;border-radius:50%;background:#17110d;transition:.13s}.eye:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:white;left:4px;top:4px;opacity:.85}
              #eyeL{left:32px}#eyeR{right:32px}.brow{position:absolute;top:5px;width:30px;height:6px;border-radius:999px;background:#2a1710;transition:.18s}#browL{left:25px}#browR{right:25px}
              #mouth{position:absolute;left:50%;top:57px;width:44px;height:18px;transform:translateX(-50%);border-bottom:6px solid #351812;border-radius:0 0 44px 44px;transition:.18s}
              #controls{position:fixed;left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));z-index:25;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
              button{min-height:46px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(27,42,36,.88);color:white;font-weight:750;font-size:13px;box-shadow:0 5px 18px rgba(0,0,0,.28)}button.active,button:active{background:rgba(81,124,89,.96);transform:scale(.97)}
              #loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 35%,#294238,#111916 70%)}#loading.hidden{display:none}
              .spinner{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
              #loading strong{display:block;font-size:22px;margin-bottom:8px}#loading small{opacity:.8;line-height:1.45}
            </style>
          </head>
          <body>
            <canvas id="scene"></canvas>
            <div id="top"><div class="pill">Capibara · Offline α0.4</div><div class="pill" id="status">Cargando archivo local</div></div>
            <div id="face"><div class="brow" id="browL"></div><div class="brow" id="browR"></div><div class="eye" id="eyeL"></div><div class="eye" id="eyeR"></div><div id="mouth"></div></div>
            <div id="controls"><button data-exp="neutral" class="active">Neutral</button><button data-exp="happy">Feliz</button><button data-exp="sad">Triste</button><button data-exp="angry">Enojado</button><button data-exp="surprised">Sorprendido</button><button data-exp="sleepy">Dormido</button></div>
            <div id="loading"><div><div class="spinner"></div><strong>Cargando el GLB incorporado</strong><small>El modelo, las texturas y el motor 3D están dentro de la aplicación. No necesita Internet.</small></div></div>
            <script src="three.min.js"></script>
            <script src="GLTFLoader.js"></script>
            <script src="meshopt_decoder.js"></script>
            <script>
            (()=>{
              'use strict';
              const canvas=document.getElementById('scene'),status=document.getElementById('status'),loading=document.getElementById('loading');
              const eyeL=document.getElementById('eyeL'),eyeR=document.getElementById('eyeR'),browL=document.getElementById('browL'),browR=document.getElementById('browR'),mouth=document.getElementById('mouth');
              let current='neutral',blinkHandle;
              function resetFace(){[eyeL,eyeR].forEach(e=>{e.style.height='27px';e.style.top='18px';e.style.transform='scale(1)';e.style.borderRadius='50%'});browL.style.transform=browR.style.transform='rotate(0deg)';browL.style.top=browR.style.top='5px';Object.assign(mouth.style,{top:'57px',width:'44px',height:'18px',border:'0',borderBottom:'6px solid #351812',borderRadius:'0 0 44px 44px',background:'transparent'})}
              function setExpression(name){current=name;document.querySelectorAll('[data-exp]').forEach(b=>b.classList.toggle('active',b.dataset.exp===name));resetFace();if(name==='happy'){eyeL.style.transform=eyeR.style.transform='scaleY(.72)';mouth.style.width='56px';mouth.style.height='26px'}else if(name==='sad'){browL.style.transform='rotate(-16deg)';browR.style.transform='rotate(16deg)';mouth.style.top='66px';mouth.style.borderBottom='0';mouth.style.borderTop='6px solid #351812';mouth.style.borderRadius='44px 44px 0 0'}else if(name==='angry'){browL.style.transform='rotate(20deg)';browR.style.transform='rotate(-20deg)';browL.style.top=browR.style.top='12px';eyeL.style.transform=eyeR.style.transform='scaleY(.74)';mouth.style.width='38px'}else if(name==='surprised'){eyeL.style.transform=eyeR.style.transform='scale(1.25)';mouth.style.top='55px';mouth.style.width='24px';mouth.style.height='30px';mouth.style.border='5px solid #351812';mouth.style.borderRadius='50%'}else if(name==='sleepy'){[eyeL,eyeR].forEach(e=>{e.style.height='5px';e.style.top='31px';e.style.borderRadius='999px'});mouth.style.width='28px';mouth.style.height='10px';mouth.style.borderBottomWidth='4px'}}
              function scheduleBlink(){clearTimeout(blinkHandle);blinkHandle=setTimeout(()=>{if(current!=='sleepy'){eyeL.style.height=eyeR.style.height='4px';eyeL.style.top=eyeR.style.top='31px';setTimeout(()=>setExpression(current),130)}scheduleBlink()},2200+Math.random()*2600)}
              document.querySelectorAll('[data-exp]').forEach(b=>b.addEventListener('click',()=>{setExpression(b.dataset.exp);scheduleBlink()}));

              const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.setClearColor(0x101815,1);
              const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,1000);camera.position.set(2,1.5,4);
              scene.add(new THREE.HemisphereLight(0xffffff,0x263b31,1.35));const key=new THREE.DirectionalLight(0xffffff,1.8);key.position.set(4,7,5);scene.add(key);const fill=new THREE.DirectionalLight(0xb9d7ff,.7);fill.position.set(-4,2,-3);scene.add(fill);
              const floor=new THREE.Mesh(new THREE.CircleGeometry(4,96),new THREE.MeshStandardMaterial({color:0x1d3427,roughness:.95,metalness:0}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
              let model=null,target=new THREE.Vector3(),radius=4,drag=false,lastX=0,lastY=0,yaw=0,pitch=.1;
              canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.1,Math.min(1.1,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});
              canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(.5,Math.min(40,radius*(1+Math.sign(e.deltaY)*.08)))},{passive:false});
              let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)radius=Math.max(.5,Math.min(40,radius*(pinch/d)));pinch=d}},{passive:false});canvas.addEventListener('touchend',()=>pinch=0);

              const loader=new THREE.GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);status.textContent='Leyendo capibara.glb';
              loader.load('capibara.glb',gltf=>{model=gltf.scene;scene.add(model);model.rotation.y=Math.PI;const box=new THREE.Box3().setFromObject(model),size=new THREE.Vector3(),center=new THREE.Vector3();box.getSize(size);box.getCenter(center);model.position.sub(center);box.setFromObject(model);box.getCenter(target);const span=Math.max(size.x,size.y,size.z,1);radius=span*2.15;floor.scale.setScalar(Math.max(span*.75,1));floor.position.y=box.min.y-.015*span;status.textContent='GLB local listo';loading.classList.add('hidden');setExpression('neutral');scheduleBlink()},xhr=>{if(xhr.total)status.textContent='GLB local '+Math.round(xhr.loaded/xhr.total*100)+'%'},err=>{console.error(err);status.textContent='Error local';loading.querySelector('strong').textContent='No se pudo abrir el GLB incorporado';loading.querySelector('small').textContent=String(err&&err.message?err.message:err)});
              function frame(){requestAnimationFrame(frame);const cp=Math.cos(pitch);camera.position.set(target.x+Math.sin(yaw)*cp*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*cp*radius);camera.lookAt(target);renderer.render(scene,camera)}frame();
              addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
            })();
            </script>
          </body>
          </html>
          EOF

          grep -RInE 'https?://' "$ASSETS/index.html" && exit 1 || true
          test ! -s <(grep -RIn 'android.permission.INTERNET' "$PROJECT/app/src/main/AndroidManifest.xml")

      - name: Build unsigned release APK
        working-directory: CapibaraOfflineAlpha04
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          UNSIGNED="CapibaraOfflineAlpha04/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="Capibara-Offline-GLB-Alpha-0.4-aligned.apk"
          FINAL="Capibara-Offline-GLB-Alpha-0.4.apk"
          PASS="CapibaraOfflineAlpha04-2026"
          keytool -genkeypair -noprompt -keystore capibara-offline-alpha04.jks -storepass "$PASS" -keypass "$PASS" -alias capibaraoffline -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 10000 -dname "CN=Capibara Offline Alpha 0.4, OU=Android, O=MedinaParra, L=Antofagasta, ST=Antofagasta, C=CL"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks capibara-offline-alpha04.jks --ks-key-alias capibaraoffline --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee Capibara-Offline-GLB-Alpha-0.4-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" | tee Capibara-Offline-GLB-Alpha-0.4-badging.txt
          unzip -p "$FINAL" assets/capibara.glb | sha256sum | tee Capibara-Offline-GLB-Alpha-0.4-glb.sha256
          test "$(unzip -p "$FINAL" assets/capibara.glb | wc -c)" = "13168280"
          unzip -p "$FINAL" assets/capibara.glb | sha256sum | grep -q '^de01c18f6fdb37f353c3ed76924361e543aa30b8872f17a6cd957529f30191ce'
          if "$BUILD_TOOLS/aapt" dump permissions "$FINAL" | grep -q INTERNET; then echo 'ERROR: APK contains INTERNET permission'; exit 1; fi
          unzip -l "$FINAL" | grep -E 'assets/(capibara\.glb|three\.min\.js|GLTFLoader\.js|meshopt_decoder\.js|index\.html)' | tee Capibara-Offline-GLB-Alpha-0.4-assets.txt
          sha256sum "$FINAL" | tee Capibara-Offline-GLB-Alpha-0.4.apk.sha256
          rm -f "$ALIGNED" capibara-offline-alpha04.jks

      - name: Package source
        run: tar -czf Capibara-Offline-GLB-Alpha-0.4-source.tar.gz CapibaraOfflineAlpha04

      - name: Upload APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: Capibara-Offline-GLB-Alpha-0.4
          path: |
            Capibara-Offline-GLB-Alpha-0.4.apk
            Capibara-Offline-GLB-Alpha-0.4.apk.sha256
            Capibara-Offline-GLB-Alpha-0.4-glb.sha256
            Capibara-Offline-GLB-Alpha-0.4-signature.txt
            Capibara-Offline-GLB-Alpha-0.4-badging.txt
            Capibara-Offline-GLB-Alpha-0.4-assets.txt
            Capibara-Offline-GLB-Alpha-0.4-source.tar.gz
          if-no-files-found: error
          retention-days: 30
