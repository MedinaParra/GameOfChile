name: Llamada Flaite Android APK

on:
  pull_request:
    paths:
      - 'llamada-flaite-mvp/**'
      - '.github/workflows/llamada-flaite-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: llamada-flaite-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check neural voice backend
        run: node --check voice-backend/server.js

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LlamadaFlaite-alpha3-neural-apk
          path: llamada-flaite-mvp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
