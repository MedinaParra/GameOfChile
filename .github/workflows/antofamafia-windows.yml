name: Build AntofaMafia Windows

on:
  push:
    branches:
      - agent/antofamafia-v0.2
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct AntofaMafia source
        shell: bash
        run: |
          cat antofa_bundle.part1.b64 antofa_bundle.part2.b64 antofa_bundle.part3.b64 antofa_bundle.part4.b64 | tr -d '\r\n' | base64 -d > /tmp/AntofaMafia_v0.2_Source.zip
          unzip -t /tmp/AntofaMafia_v0.2_Source.zip
          rm -rf AntofaMafia AntofaMafia_v0.2
          unzip -q /tmp/AntofaMafia_v0.2_Source.zip
          mv AntofaMafia_v0.2 AntofaMafia

      - name: Export with Godot
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./AntofaMafia/
          archive_output: false
          cache: true

      - name: Verify and stage Windows package
        shell: bash
        run: |
          BUILD_DIR="/home/runner/.local/share/godot/builds/Windows Desktop"
          echo "Godot build output:"
          ls -lah "$BUILD_DIR"
          EXE="$BUILD_DIR/AntofaMafia.exe"
          if [ ! -f "$EXE" ]; then
            echo "AntofaMafia.exe not found at expected Godot export path"
            exit 1
          fi
          file "$EXE"
          sha256sum "$EXE"
          mkdir -p dist/AntofaMafia-Windows
          cp "$EXE" dist/AntofaMafia-Windows/AntofaMafia.exe
          if [ -f "$BUILD_DIR/AntofaMafia.pck" ]; then
            cp "$BUILD_DIR/AntofaMafia.pck" dist/AntofaMafia-Windows/
          fi
          cp AntofaMafia/README.md AntofaMafia/LICENSE AntofaMafia/THIRD_PARTY.md dist/AntofaMafia-Windows/
          (cd dist && zip -r AntofaMafia_v0.2_Windows.zip AntofaMafia-Windows)
          unzip -l dist/AntofaMafia_v0.2_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntofaMafia-v0.2-Windows
          path: dist/AntofaMafia_v0.2_Windows.zip
          if-no-files-found: error
