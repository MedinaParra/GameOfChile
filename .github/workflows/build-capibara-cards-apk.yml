name: Build Capibara Cards APK

on:
  push:
    branches:
      - agent/capibara-cards-apk
    paths:
      - "capibara-cards-source.tar.gz.b64"
      - ".github/workflows/build-capibara-cards-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capibara-cards-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.7.1"
      GODOT_RELEASE: "4.7.1-stable"
      MODEL_URL: "https://tripo-data.rg1.data.tripo3d.com/tripo-studio/20260804/b83cf9ce-7a63-4a9c-8b78-23bf148a34f0/tripo_pbr_model_b83cf9ce-7a63-4a9c-8b78-23bf148a34f0_meshopt.glb"
      PROJECT_DIR: "capibara-cazador-cartas"
      APK_PATH: "capibara-cazador-cartas/builds/android/Capibara_Cazador_Cartas-debug.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore and validate game source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode capibara-cards-source.tar.gz.b64 > "$RUNNER_TEMP/capibara-source.tar.gz"
          echo "8551909fde5547eba86bea0eb8e04f810f69d46080ba21eec8116456e7b50953  $RUNNER_TEMP/capibara-source.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/capibara-source.tar.gz"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Set up Node for 3D optimization
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and optimize the exact capybara model
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PROJECT_DIR/assets/models"
          rm -f "$PROJECT_DIR/assets/models/capybara_optimized.glb"

          if curl --fail --location --retry 5 --retry-delay 4 \
              --connect-timeout 30 --max-time 600 \
              "$MODEL_URL" -o /tmp/capybara_original.glb; then
            echo "Exact Tripo capybara downloaded: $(du -h /tmp/capybara_original.glb | cut -f1)"
            npm install --global @gltf-transform/cli
            if gltf-transform optimize \
                /tmp/capybara_original.glb \
                "$PROJECT_DIR/assets/models/capybara_optimized.glb" \
                --simplify true \
                --simplify-ratio 0.06 \
                --simplify-error 0.01 \
                --texture-compress webp \
                --texture-size 1024 \
                --compress meshopt; then
              echo "Optimized capybara: $(du -h "$PROJECT_DIR/assets/models/capybara_optimized.glb" | cut -f1)"
            else
              echo "Optimization failed; including the exact original model."
              cp /tmp/capybara_original.glb "$PROJECT_DIR/assets/models/capybara_optimized.glb"
            fi
          else
            echo "The temporary Tripo URL was unavailable; the built-in procedural capybara will be used."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot-templates"

          curl --fail --location --retry 5 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"

          curl --fail --location --retry 5 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"

          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import --quit --verbose

      - name: Export signed debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" \
            --export-debug "Android" "builds/android/Capibara_Cazador_Cartas-debug.apk" \
            --verbose
          test -s "$APK_PATH"
          file "$APK_PATH"
          sha256sum "$APK_PATH" | tee "$APK_PATH.sha256"
          ls -lh "$APK_PATH" "$APK_PATH.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Capibara-Cazador-Cartas-APK
          path: |
            capibara-cazador-cartas/builds/android/Capibara_Cazador_Cartas-debug.apk
            capibara-cazador-cartas/builds/android/Capibara_Cazador_Cartas-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
