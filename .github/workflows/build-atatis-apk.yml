name: Build A-tatis APK

on:
  push:
    branches: [ "atatis-openworld-3d" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          base64 -d A-tatis-source.zip.b64 > A-tatis-source.zip
          unzip -q A-tatis-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - name: Build debug APK
        working-directory: A-tatis
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp A-tatis/app/build/outputs/apk/debug/app-debug.apk A-tatis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A-tatis-APK
          path: A-tatis.apk
          if-no-files-found: error
