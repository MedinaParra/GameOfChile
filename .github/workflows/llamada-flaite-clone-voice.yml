name: Llamada Flaite Clone Voice APK

on:
  push:
    branches:
      - agent/llamada-flaite-local-voice
    paths:
      - 'llamada-flaite-clone-voice/**'
      - '.github/workflows/llamada-flaite-clone-voice.yml'
  pull_request:
    paths:
      - 'llamada-flaite-clone-voice/**'
      - '.github/workflows/llamada-flaite-clone-voice.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout GameOfChile
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download pinned Android voice-cloning source
        shell: bash
        run: |
          set -euo pipefail
          NEKO_COMMIT=8248728d725958dbef8fab523a7ca2a8aad5c6d8
          curl --fail --location --retry 4 \
            --output /tmp/nekospeak.tar.gz \
            "https://github.com/siva-sub/NekoSpeak/archive/${NEKO_COMMIT}.tar.gz"
          mkdir -p /tmp/alpha7-src
          tar -xzf /tmp/nekospeak.tar.gz -C /tmp/alpha7-src --strip-components=1
          test -f /tmp/alpha7-src/app/build.gradle.kts
          test -f /tmp/alpha7-src/LICENSE

      - name: Apply Spanish authorized-cloning patch
        run: |
          python3 llamada-flaite-clone-voice/prepare_alpha7.py /tmp/alpha7-src
          grep -R "lookbe/pocket-tts-onnx/resolve/main/spanish" /tmp/alpha7-src/app/src/main/java/com/nekospeak/tts/data/ModelRepository.kt
          grep -R "Confirmo que esta es mi voz" /tmp/alpha7-src/app/src/main/java/com/nekospeak/tts/ui/screens/VoiceRecorderScreen.kt

      - name: Build alpha7 debug APK
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/alpha7-src
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/llamada-flaite-clone-voice/build.log"

      - name: Select installable APK
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/alpha7-src/app/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find /tmp/alpha7-src/app/build/outputs/apk -type f -name '*arm64-v8a*debug*.apk' | head -n 1 || true)
          if [ -z "$APK" ]; then
            APK=$(find /tmp/alpha7-src/app/build/outputs/apk -type f -name '*universal*debug*.apk' | head -n 1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find /tmp/alpha7-src/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1 || true)
          fi
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/llamada-flaite-clone-voice/LlamadaFlaite-IA-alpha7-clona-voz.apk"
          sha256sum "$GITHUB_WORKSPACE/llamada-flaite-clone-voice/LlamadaFlaite-IA-alpha7-clona-voz.apk" | tee "$GITHUB_WORKSPACE/llamada-flaite-clone-voice/SHA256.txt"
          ls -lh "$GITHUB_WORKSPACE/llamada-flaite-clone-voice/LlamadaFlaite-IA-alpha7-clona-voz.apk"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LlamadaFlaite-alpha7-clone-build-log
          path: llamada-flaite-clone-voice/build.log
          if-no-files-found: ignore

      - name: Upload alpha7 APK
        uses: actions/upload-artifact@v4
        with:
          name: LlamadaFlaite-alpha7-clona-voz-apk
          path: |
            llamada-flaite-clone-voice/LlamadaFlaite-IA-alpha7-clona-voz.apk
            llamada-flaite-clone-voice/SHA256.txt
          if-no-files-found: error
          compression-level: 0
